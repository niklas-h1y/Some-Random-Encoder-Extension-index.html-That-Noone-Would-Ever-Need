<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound / Script — Field Guide 01</title>
    <style>
        :root {
            --bg-color: #f4f5f8;
            --container-bg: #ffffff;
            --accent-color: #3b50df;
            --accent-text: #ffffff;
            --text-main: #111424;
            --text-muted: #677189;
            --border-color: #e2e5ec;
            --btn-clear-bg: #eceff6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--container-bg);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 18px;
            color: var(--accent-color);
        }

        .brand-name {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .field-guide {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .hero-section {
            padding: 0 24px 24px 24px;
        }

        .hero-sub {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 500;
            line-height: 1.1;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .mode-selector {
            display: flex;
            margin: 0 24px 24px 24px;
            background-color: #f0f2f7;
            padding: 4px;
            border-radius: 14px;
        }

        .mode-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .mode-btn.active {
            background-color: var(--container-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .workspace {
            padding: 0 24px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .card-title span {
            color: var(--accent-color);
            margin-right: 4px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #27c24c;
            border-radius: 50%;
        }

        .status-badge.sound-led {
            color: var(--accent-color);
            background-color: #eef1fe;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .status-badge.sound-led::before {
            display: none;
        }

        .input-area {
            width: 100%;
            height: 110px;
            border: none;
            resize: none;
            font-size: 16px;
            line-height: 1.4;
            color: var(--text-main);
            outline: none;
        }

        .output-area {
            width: 100%;
            min-height: 110px;
            font-size: 20px;
            line-height: 1.5;
            color: var(--text-main);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .action-row {
            display: flex;
            gap: 12px;
            padding: 0 24px 24px 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-clear {
            background-color: var(--btn-clear-bg);
            color: var(--text-main);
            flex: 1;
        }

        .btn-clear:hover {
            background-color: #e2e6f0;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--accent-text);
            flex: 2;
        }

        .btn-primary:hover {
            background-color: #2e42c7;
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="brand">
                <span class="brand-icon">文</span>
                <span class="brand-name">Sound / Script</span>
            </div>
            <div class="field-guide">Field Guide 01</div>
        </div>

        <div class="hero-section">
            <div class="hero-sub">A little closer to the sound</div>
            <h1 class="hero-title">Hear the shape of English.</h1>
            <p class="hero-desc">Watch familiar words shift into a script shaped by sound.</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" id="btn-encode">Encode</button>
            <button class="mode-btn" id="btn-decode">Decode</button>
        </div>

        <div class="workspace">
            <!-- Source Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><span id="src-num">01</span> <span id="src-label">Standard text</span></div>
                    <div class="status-badge" id="src-status">Live</div>
                </div>
                <textarea class="input-area" id="input-text" placeholder="Type here..."></textarea>
                <div class="card-footer">
                    <span id="char-count">0 characters</span>
                    <span id="word-count">0 words</span>
                </div>
            </div>

            <!-- Target Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><span id="tgt-num">02</span> <span id="tgt-label">Phonetic script</span></div>
                    <div class="status-badge sound-led" id="tgt-status">Sound-Led</div>
                </div>
                <div class="output-area" id="output-text"></div>
                <div class="card-footer">
                    <span id="output-meta">Instant conversion</span>
                    <span id="output-char-count">0 characters</span>
                </div>
            </div>
        </div>

        <div class="action-row">
            <button class="btn btn-clear" id="btn-clear-action">Clear</button>
            <button class="btn btn-primary" id="btn-copy-action">Copy output</button>
        </div>


    </div>

    <script>
        // Phonetic Rules based on user parameters and demonstration text
        const phoneticRules = [
            // Structural digraphs & blends
            { pattern: /watch/gi, replace: 'ƿætч' },
            { pattern: /changes/gi, replace: 'чanʒes' },
            { pattern: /changed/gi, replace: 'чanʒeΔ' },
            { pattern: /shouting/gi, replace: 'ƩøυtIŋ' },
            { pattern: /thoroughfare/gi, replace: 'þørøυghfare' },
            { pattern: /through/gi, replace: 'þrøυgh' },
            { pattern: /whether/gi, replace: 'ƿheðer' },
            
            // Consonants
            { pattern: /shall/gi, replace: 'ʃall' },
            { pattern: /ship/gi, replace: 'ʃIp' },
            { pattern: /the /gi, replace: 'ðe ' },
            { pattern: /the\b/gi, replace: 'ðe' },
            { pattern: / king/gi, replace: ' kIŋ' },
            { pattern: /queen/gi, replace: 'qυeen' },
            { pattern: /and/gi, replace: 'anΔ' },
            { pattern: /vision/gi, replace: 'vIzøn' },
            
            // Custom font mapping rules for character substitution
            { pattern: /w/g, replace: 'ƿ' },
            { pattern: /W/g, replace: 'Ƿ' },
            { pattern: /d/g, replace: 'Δ' },
            { pattern: /m/g, replace: 'ɱ' },
            { pattern: /g/g, replace: 'ʒ' },
            { pattern: /t/g, replace: 't' }, 
            { pattern: /h/g, replace: 'ч' },
            { pattern: /o/g, replace: 'ø' },
            { pattern: /O/g, replace: 'Ø' },
            { pattern: /a/g, replace: 'υ' },
            { pattern: /i/g, replace: 'I' },
            { pattern: /n/g, replace: 'n' },
            { pattern: /u/g, replace: 'υ' },
            { pattern: /A/g, replace: 'Æ' },
            { pattern: /s/g, replace: 's' }
        ];

        // Decode Rules (Inverse Map)
        const decodeRules = [
            { pattern: /ƿætч/gi, replace: 'watch' },
            { pattern: /чanʒes/gi, replace: 'changes' },
            { pattern: /чanʒeΔ/gi, replace: 'changed' },
            { pattern: /ƩøυtIŋ/gi, replace: 'shouting' },
            { pattern: /þørøυghfare/gi, replace: 'thoroughfare' },
            { pattern: /þrøυgh/gi, replace: 'through' },
            { pattern: /ƿheðer/gi, replace: 'whether' },
            { pattern: /ʃall/gi, replace: 'shall' },
            { pattern: /ʃIp/gi, replace: 'ship' },
            { pattern: /ðe /gi, replace: 'the ' },
            { pattern: /kIŋ/gi, replace: 'king' },
            { pattern: /qυeen/gi, replace: 'queen' },
            { pattern: /anΔ/gi, replace: 'and' },
            { pattern: /vIzøn/gi, replace: 'vision' },
            
            // Basic layout unmapping
            { pattern: /ƿ/g, replace: 'w' },
            { pattern: /Ƿ/g, replace: 'W' },
            { pattern: /Δ/g, replace: 'd' },
            { pattern: /ɱ/g, replace: 'm' },
            { pattern: /ʒ/g, replace: 'g' },
            { pattern: /ч/g, replace: 'h' },
            { pattern: /ø/g, replace: 'o' },
            { pattern: /Ø/g, replace: 'O' },
            { pattern: /I/g, replace: 'i' },
            { pattern: /υ/g, replace: 'u' },
            { pattern: /Æ/g, replace: 'A' },
            { pattern: /ʃ/g, replace: 'sh' }
        ];

        // App State
        let currentMode = 'encode'; // 'encode' or 'decode'

        // DOM Elements
        const btnEncode = document.getElementById('btn-encode');
        const btnDecode = document.getElementById('btn-decode');
        const srcNum = document.getElementById('src-num');
        const srcLabel = document.getElementById('src-label');
        const srcStatus = document.getElementById('src-status');
        const tgtNum = document.getElementById('tgt-num');
        const tgtLabel = document.getElementById('tgt-label');
        const tgtStatus = document.getElementById('tgt-status');
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');
        const outputCharCount = document.getElementById('output-char-count');
        const btnClear = document.getElementById('btn-clear-action');
        const btnCopy = document.getElementById('btn-copy-action');

        // Toggle App Mode
        btnEncode.addEventListener('click', () => {
            if (currentMode === 'encode') return;
            currentMode = 'encode';
            btnEncode.classList.add('active');
            btnDecode.classList.remove('active');
            
            // Update labels
            srcNum.textContent = '01';
            srcLabel.textContent = 'Standard text';
            srcStatus.textContent = 'Live';
            tgtNum.textContent = '02';
            tgtLabel.textContent = 'Phonetic script';
            tgtStatus.textContent = 'Sound-Led';
            
            inputText.value = '';
            processText();
        });

        btnDecode.addEventListener('click', () => {
            if (currentMode === 'decode') return;
            currentMode = 'decode';
            btnDecode.classList.add('active');
            btnEncode.classList.remove('active');
            
            // Update labels inverse
            srcNum.textContent = '01';
            srcLabel.textContent = 'Phonetic script';
            srcStatus.textContent = 'Live';
            tgtNum.textContent = '02';
            tgtLabel.textContent = 'Standard text';
            tgtStatus.textContent = 'Decoded';
            
            inputText.value = '';
            processText();
        });

        // Processing Logic
        function processText() {
            const raw = inputText.value;
            
            // Meta counts for incoming text
            charCount.textContent = `${raw.length} characters`;
            const words = raw.trim() === '' ? 0 : raw.trim().split(/\s+/).length;
            wordCount.textContent = `${words} words`;

            let result = raw;
            const ruleset = currentMode === 'encode' ? phoneticRules : decodeRules;

            // Apply conversions sequentially
            ruleset.forEach(rule => {
                result = result.replace(rule.pattern, rule.replace);
            });

            outputText.textContent = result;
            outputCharCount.textContent = `${result.length} characters`;
        }

        inputText.addEventListener('input', processText);

        // Action Handlers
        btnClear.addEventListener('click', () => {
            inputText.value = '';
            processText();
        });

        btnCopy.addEventListener('click', () => {
            const textToCopy = outputText.textContent;
            if (!textToCopy) return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnCopy.textContent;
                btnCopy.textContent = 'Copied!';
                btnCopy.style.backgroundColor = '#27c24c';
                setTimeout(() => {
                    btnCopy.textContent = originalText;
                    btnCopy.style.backgroundColor = 'var(--accent-color)';
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        });
    </script>
</body>
</html>
