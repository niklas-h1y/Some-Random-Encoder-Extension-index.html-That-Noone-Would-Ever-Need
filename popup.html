<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound / Script</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--accent:#3b50df;--text:#111424;--muted:#677189;--border:#e2e5ec}
*{box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{width:320px;background:var(--bg);color:var(--text);padding:14px}
.app{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px #0000000c}
header{padding:19px 20px 8px}
.brand{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.brand span{color:var(--accent);font-size:18px;margin-right:8px}
.hero{padding:15px 20px 20px}
.kicker{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:7px}
h1{font-size:29px;line-height:1.08;font-weight:600;letter-spacing:-.5px}
.desc{font-size:12px;line-height:1.5;color:var(--muted);margin-top:9px}
.actions{padding:0 20px 18px}
button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;font-size:14px;font-weight:750;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.hint{font-size:10px;line-height:1.5;color:var(--muted);text-align:center;padding:0 20px 18px}
#status{min-height:16px;margin-top:10px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span>文</span>Sound / Script</div></header>
<section class="hero">
<div class="kicker">Field Guide 01 · Mischief mode</div>
<h1>Encode the whole page.</h1>
<p class="desc">One click turns the page you're looking at into Sound / Script. Want normal text back? Just refresh.</p>
</section>
<div class="actions">
<button id="encode-page" type="button">Encode this page ↗</button>
<div id="status" role="status" aria-live="polite"></div>
</div>
<p class="hint">Only visible page text is changed. Page layout and controls stay put.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
